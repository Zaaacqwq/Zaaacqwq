name: Coding Habits

on:
  schedule:
    # 04:00 UTC daily
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Update the "Coding Habits" section
        # This revision declares the AI display switches added after the v5 tag.
        uses: anmol098/waka-readme-stats@18146e87e945092519c11353547bf066daa99e46
        with:
          # A classic PAT with `repo` + `read:user` scope. GITHUB_TOKEN is not
          # sufficient: the action reads data across all of your repositories.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Still required even though every WakaTime block is off below: the
          # action hard-fails at startup without it. Keep the secret in place.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          # --- Enabled: "My GitHub Data", commit-hour and day-of-week charts ---
          SHOW_SHORT_INFO: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LINES_OF_CODE: "True"

          # --- Disabled ---
          SHOW_TOTAL_CODE_TIME: "False"  # "Code Time" badge
          SHOW_AI_CODE_TIME: "False"  # "AI Code Time" badge
          SHOW_AI_CODING: "False"  # weekly AI coding breakdown
          SHOW_LANGUAGE_PER_REPO: "False"  # "I Mostly Code in ..."
          SHOW_LOC_CHART: "False"  # "Timeline" bar graph
          SHOW_PROFILE_VIEWS: "False"  # counter already in the header

          # "This Week I Spent My Time On" — all five sub-blocks off
          SHOW_TIMEZONE: "False"
          SHOW_LANGUAGE: "False"
          SHOW_EDITORS: "False"
          SHOW_PROJECTS: "False"
          SHOW_OS: "False"

          # Commit as readme-bot so the daily README refresh does not count
          # toward the contribution graph.
          COMMIT_BY_ME: "False"
          COMMIT_MESSAGE: "chore: update coding habits"
