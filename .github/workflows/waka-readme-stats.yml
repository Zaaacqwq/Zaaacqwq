name: Coding Habits

on:
  schedule:
    # 04:00 UTC daily
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Update the "Coding Habits" section
        uses: anmol098/waka-readme-stats@v5
        with:
          # A classic PAT with `repo` + `read:user` scope. GITHUB_TOKEN is not
          # sufficient: the action reads data across all of your repositories.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Required — the action hard-fails at startup without it, even when
          # every WakaTime block below is disabled. Get it from
          # https://wakatime.com/settings/api-key
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          # --- GitHub-derived blocks ---
          SHOW_SHORT_INFO: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_LOC_CHART: "True"
          SHOW_PROFILE_VIEWS: "False"

          # --- WakaTime-derived blocks ---
          # These stay empty ("No Activity Tracked This Week") until the editor
          # plugin has been installed and has reported some time.
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_TIMEZONE: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_PROJECTS: "True"
          SHOW_OS: "True"

          COMMIT_BY_ME: "True"
          COMMIT_MESSAGE: "chore: update coding habits"
